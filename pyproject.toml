[project]
name = "gammaray"
version = "0.1.0"
description = "Gamma resource workshop: unpack / convert / pack"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
full = [
  "pillow",
  "numpy",
  "texture2ddecoder",
]

[project.scripts]
gammaray = "gammaray.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
